<body>

<h1>🚗 Smart Headlight Dashboard</h1>

<div class="card">
  <h2 id="mode">Mode: Day</h2>
  <h2 id="beam">Beam: OFF</h2>
  <h3 id="intensity">Intensity: 0%</h3>
  <h3 id="vehicle">Vehicle: Not Detected</h3>
</div>

<button class="high" onclick="setHigh()">High Beam</button> <button class="low" onclick="setLow()">Low Beam</button>

<script>

function setHigh() {
  document.getElementById("mode").innerText = "Mode: Night";
  document.getElementById("beam").innerText = "Beam: HIGH";
  document.getElementById("intensity").innerText = "Intensity: 100%";
  document.getElementById("vehicle").innerText = "Vehicle: Not Detected";
}

function setLow() {
  document.getElementById("mode").innerText = "Mode: Night";
  document.getElementById("beam").innerText = "Beam: LOW";
  document.getElementById("intensity").innerText = "Intensity: 40%";
  document.getElementById("vehicle").innerText = "Vehicle: Detected";
}

// Auto simulation
setInterval(() => {
  let rand = Math.random();

  if (rand < 0.3) {
    document.getElementById("mode").innerText = "Mode: Day";
    document.getElementById("beam").innerText = "Beam: OFF";
    document.getElementById("intensity").innerText = "Intensity: 0%";
    document.getElementById("vehicle").innerText = "Vehicle: Not Detected";
  } else if (rand < 0.6) {
    setLow();
  } else {
    setHigh();
  }

}, 3000);

</script>

</body>
